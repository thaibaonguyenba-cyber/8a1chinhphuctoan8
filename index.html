<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>8a1 học toán cùng NBTB</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky game-style header (level + XP), three part tabs, one working card per view, dark neon identity */
:root{
  --bg:#0c0a1f; --surface:#161337; --surface2:#1e1a47; --line:#322c6b;
  --fg:#ece9ff; --muted:#a29dd0; --violet:#8b5cf6; --violet-d:#6d3fe0; --cyan:#22d3ee;
  --good:#34d399; --bad:#fb7185; --warn:#fbbf24; --glow:rgba(139,92,246,.35);
  --font-d:"Space Grotesk","Inter",system-ui,sans-serif; --font-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--fg); font:15px/1.6 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 280px}
.mark{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 24px var(--font-d);
  background:linear-gradient(135deg,var(--violet),var(--cyan));color:#0c0a1f;box-shadow:0 0 22px var(--glow)}
.brand h1{font-size:1.2rem;overflow-wrap:anywhere}
.brand small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.me{display:flex;align-items:center;gap:12px;flex:0 1 auto;min-width:0}
.lvl{font:700 .8rem var(--font-d);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.xp{width:130px;min-width:0}
.xp-top{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-bottom:3px;gap:8px}
.xp-bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:99px;transition:width .4s}
.uname{font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-state{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--bg);padding:8px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:1px;transition:border-color .15s,background .15s}
.tab span{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tab b{font:600 1.05rem var(--font-d)}
.tab:hover{border-color:var(--violet)}
.tab[aria-selected="true"]{background:var(--surface2);border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 20px var(--glow)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}.xp{width:100px}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.82rem}
label.l{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 5px;letter-spacing:.03em}
textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.55}
textarea:focus,input:focus,select:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px var(--glow)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;
  transition:transform .1s,border-color .15s,background .15s;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--violet)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 0 18px var(--glow)}
.btn.primary:hover{background:var(--violet-d)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:.84rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* math toolbar */
.tb{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sym{min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font:500 15px var(--font-b);padding:0 8px}
.sym:hover{border-color:var(--cyan);color:var(--cyan)}

/* images */
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.thumb{position:relative;display:inline-block;margin-top:10px;max-width:100%}
.thumb img{display:block;max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);background:#fff}
.thumb .x{position:absolute;top:6px;right:6px}
.qimg{display:block;max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line);margin-top:10px;background:#fff}

/* items */
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--cyan);background:var(--bg);white-space:nowrap}
.tag.v{color:#c4b5fd}
.qcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qtext{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.ai-box{background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.35);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.ai-box b.h{display:block;font:600 .75rem var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;padding:3px 11px;border-radius:99px}
.pill.ok{background:rgba(52,211,153,.15);color:var(--good);border:1px solid rgba(52,211,153,.5)}
.pill.no{background:rgba(251,113,133,.15);color:var(--bad);border:1px solid rgba(251,113,133,.5)}
.pill.mid{background:rgba(251,191,36,.14);color:var(--warn);border:1px solid rgba(251,191,36,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 14px;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.score{font:700 3rem var(--font-d);line-height:1}
.score small{font-size:1.1rem;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--violet)}
.opt input{margin-top:5px;accent-color:var(--violet)}
.opt.right{border-color:var(--good);background:rgba(52,211,153,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(251,113,133,.1)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;font:600 .85rem var(--font-d);color:var(--violet);margin-bottom:6px}
.qblock{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.qblock:first-of-type{border-top:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);opacity:.5}
.badge.got{opacity:1;border-color:var(--warn);box-shadow:0 0 16px rgba(251,191,36,.18)}
.badge b{display:block;font-family:var(--font-d)}
.badge span{font-size:.78rem;color:var(--muted)}
.hello{max-width:460px;margin:8vh auto 0;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.hello .mark{width:64px;height:64px;font-size:34px;border-radius:18px}
.hello h1{font-size:1.7rem}
#toasts{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:20;padding:0 16px}
.toast{background:var(--surface2);border:1px solid var(--violet);border-radius:12px;padding:9px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:520px;font-size:.9rem}
.toast.bad{border-color:var(--bad)} .toast.gain{border-color:var(--cyan)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lb{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:r}
.lb li{counter-increment:r;display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.lb li::before{content:counter(r);font:700 .85rem var(--font-d);color:var(--cyan);min-width:22px}
.lb li span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li.me2{border-color:var(--violet);box-shadow:0 0 14px var(--glow)}
body{margin:0}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
var uid = function () { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); };
var fmt = function (n) { return (Math.round(n * 10) / 10).toString().replace('.', ','); };
var KEY_L = 'nbtb-8a1-local-v2';
var SYM = ['²', '³', '√', 'π', '±', '×', '÷', '≤', '≥', '≠', '≈', '∠', '△', '⊥', '∥', '°', '(', ')', '/'];
var TOPICS = ['Nhân, chia đa thức', 'Hằng đẳng thức đáng nhớ', 'Phân tích đa thức thành nhân tử', 'Phân thức đại số', 'Tứ giác', 'Hình bình hành, hình chữ nhật, hình thoi, hình vuông', 'Diện tích đa giác', 'Định lí Thalès', 'Tam giác đồng dạng', 'Phương trình bậc nhất một ẩn'];

/* ---------- đề mẫu ---------- */
var SAMPLE_EXAMS = [
  { id: 'ex-dai-so', title: 'Đa thức và hằng đẳng thức', topic: 'Đại số', author: 'mẫu', questions: [
    { type: 'mcq', q: 'Khai triển (x + 2)² ta được:', options: ['x² + 4', 'x² + 4x + 4', 'x² + 2x + 4', 'x² − 4x + 4'], answer: 1 },
    { type: 'mcq', q: 'Phân tích x² − 9 thành nhân tử ta được:', options: ['(x − 3)²', '(x − 3)(x + 3)', '(x + 9)(x − 1)', 'x(x − 9)'], answer: 1 },
    { type: 'mcq', q: 'Giá trị của (x − 1)(x + 1) tại x = 5 là:', options: ['24', '26', '16', '25'], answer: 0 },
    { type: 'mcq', q: 'Kết quả của phép chia 6x³y² : (2xy) là:', options: ['3x²y', '3x³y', '4x²y', '3x²y²'], answer: 0 },
    { type: 'essay', q: 'Phân tích đa thức thành nhân tử: x² − 4x + 4 − y²', ref: 'x² − 4x + 4 − y² = (x − 2)² − y² = (x − 2 − y)(x − 2 + y).' },
    { type: 'essay', q: 'Rút gọn biểu thức: (x + 3)² − (x − 3)²', ref: '(x² + 6x + 9) − (x² − 6x + 9) = 12x.' }
  ] },
  { id: 'ex-phan-thuc', title: 'Phân thức đại số', topic: 'Đại số', author: 'mẫu', questions: [
    { type: 'mcq', q: 'Phân thức 1/(x − 2) xác định khi:', options: ['x ≠ 2', 'x ≠ −2', 'x ≠ 0', 'x = 2'], answer: 0 },
    { type: 'mcq', q: 'Rút gọn (x² − 1)/(x − 1) với x ≠ 1 ta được:', options: ['x − 1', 'x + 1', 'x', '1'], answer: 1 },
    { type: 'mcq', q: 'Kết quả của 2/x + 3/x (x ≠ 0) là:', options: ['5/(2x)', '5/x', '6/x', '5/x²'], answer: 1 },
    { type: 'mcq', q: 'Kết quả của (x/3) · (6/x²) với x ≠ 0 là:', options: ['2/x', '2x', '18/x', 'x/2'], answer: 0 },
    { type: 'essay', q: 'Rút gọn phân thức (x² − 4)/(x² + 2x) với x ≠ 0 và x ≠ −2.', ref: '(x − 2)(x + 2) / [x(x + 2)] = (x − 2)/x.' },
    { type: 'essay', q: 'Thực hiện phép tính: 1/(x − 1) − 1/(x + 1) (x ≠ 1, x ≠ −1).', ref: '[(x + 1) − (x − 1)] / (x² − 1) = 2/(x² − 1).' }
  ] },
  { id: 'ex-tu-giac', title: 'Tứ giác và các hình đặc biệt', topic: 'Hình học', author: 'mẫu', questions: [
    { type: 'mcq', q: 'Tổng bốn góc của một tứ giác bằng:', options: ['180°', '270°', '360°', '540°'], answer: 2 },
    { type: 'mcq', q: 'Hình bình hành có một góc vuông là:', options: ['Hình thoi', 'Hình chữ nhật', 'Hình thang', 'Hình tròn'], answer: 1 },
    { type: 'mcq', q: 'Tứ giác có hai đường chéo vuông góc và cắt nhau tại trung điểm mỗi đường là:', options: ['Hình chữ nhật', 'Hình thoi', 'Hình thang', 'Hình thang cân'], answer: 1 },
    { type: 'mcq', q: 'Tam giác ABC có M, N lần lượt là trung điểm của AB, AC và BC = 10 cm. Độ dài MN là:', options: ['10 cm', '20 cm', '5 cm', '2,5 cm'], answer: 2 },
    { type: 'essay', q: 'Hình thoi có hai đường chéo dài 6 cm và 8 cm. Tính độ dài cạnh hình thoi.', ref: 'Hai đường chéo vuông góc tại trung điểm, mỗi nửa đường chéo là 3 cm và 4 cm. Cạnh = √(3² + 4²) = 5 cm.' },
    { type: 'essay', q: 'Chứng minh: tứ giác có hai cặp cạnh đối bằng nhau là hình bình hành.', ref: 'Tứ giác ABCD có AB = CD, AD = BC. Nối AC. Hai tam giác ABC và CDA bằng nhau (c.c.c) nên góc BAC = góc DCA, suy ra AB // CD; góc BCA = góc DAC, suy ra AD // BC. Vậy ABCD là hình bình hành.' }
  ] }
];


var SAMPLE_Q = [
  { id: 'seed1', by: 'Câu mẫu', byId: '', topic: 'Đại số', text: 'Phân tích đa thức thành nhân tử: x² − 6x + 9 − 4y²', img: null, at: 1, hint: '', sample: true },
  { id: 'seed2', by: 'Câu mẫu', byId: '', topic: 'Hình học', text: 'Cho hình chữ nhật ABCD có AB = 6 cm, BC = 8 cm. Tính độ dài đường chéo AC.', img: null, at: 0, hint: '', sample: true }
];

/* ---------- trạng thái ---------- */
function newProf() { return { xp: 0, badges: [], solved: {}, c: { asked: 0, solved: 0, perfect: 0, exams: 0, created: 0 } }; }
var DB = null;
var S = { name: '', uid: 'local', prof: newProf(), questions: [], exams: [], attempts: [], subs: [], players: [] };
var U = { tab: 'ask', badges: false, nameEdit: false, filter: 'all', openQ: null, ev: 'list', exId: null, result: null, busy: false, grading: null, confirmBlank: false, del: null, ready: false, net: 'loading', isT: false, got: {} };
var D = { img: {}, txt: {}, mc: {} };
var NEW = null;
var pendingR = false, warned = false;

function toast(msg, kind) {
  var box = $('#toasts'); if (!box) return;
  var d = document.createElement('div'); d.className = 'toast ' + (kind || ''); d.textContent = msg; box.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 4200);
}
function level() { return Math.floor(S.prof.xp / 50) + 1; }
var BADGES = [
  { id: 'q1', name: 'Câu hỏi đầu tiên', need: 'Đặt 1 câu hỏi', ok: function () { return S.prof.c.asked >= 1; } },
  { id: 's3', name: 'Thợ giải', need: 'Giải đúng 3 câu ở Phần 2', ok: function () { return S.prof.c.solved >= 3; } },
  { id: 'p10', name: 'Điểm 10', need: 'Được 10 điểm ở một đề', ok: function () { return S.prof.c.perfect >= 1; } },
  { id: 'e3', name: 'Chăm làm đề', need: 'Nộp 3 bài đề', ok: function () { return S.prof.c.exams >= 3; } },
  { id: 'cr', name: 'Nhà ra đề', need: 'Tự thêm 1 đề mới', ok: function () { return S.prof.c.created >= 1; } },
  { id: 'l5', name: 'Cấp 5', need: 'Đạt 200 XP', ok: function () { return level() >= 5; } }
];
function checkBadges() { BADGES.forEach(function (b) { if (S.prof.badges.indexOf(b.id) < 0 && b.ok()) { S.prof.badges.push(b.id); toast('Huy hiệu mới: ' + b.name, 'gain'); } }); }
function addXP(n) { S.prof.xp += n; toast('+' + n + ' XP', 'gain'); checkBadges(); saveProf(); }

/* ---------- lưu trữ ---------- */
function persistLocal() {
  if (DB) return;
  try { localStorage.setItem(KEY_L, JSON.stringify({ name: S.name, prof: S.prof, questions: S.questions, exams: S.exams, attempts: S.attempts, subs: S.subs })); }
  catch (e) { if (!warned) { warned = true; toast('Không lưu được trên máy này (bộ nhớ đầy hoặc bị chặn).', 'bad'); } }
}
function loadLocal() {
  try {
    var o = JSON.parse(localStorage.getItem(KEY_L) || 'null');
    if (o) { S.name = o.name || ''; S.prof = Object.assign(newProf(), o.prof || {}); S.prof.c = Object.assign(newProf().c, S.prof.c || {}); ['questions', 'exams', 'attempts', 'subs'].forEach(function (k) { S[k] = o[k] || []; }); }
  } catch (e) {}
}
var profBusy = false, profDirty = false;
function saveProf() {
  if (!DB) { persistLocal(); return; }
  profDirty = true; if (profBusy) return; profBusy = true;
  (function loop() {
    if (!profDirty) { profBusy = false; return; }
    profDirty = false;
    var data = JSON.parse(JSON.stringify(S.prof)); data.name = S.name;
    Promise.all([
      DB.doc('data/users/' + S.uid + '/profile').set(data),
      DB.doc('players/' + S.uid).set({ name: S.name, xp: S.prof.xp, level: level(), badges: S.prof.badges.length, at: Date.now() })

function dataUrlToBlob(u) {

}

      if (a < 0) { toast('Câu ' + (i + 1) + ': đáp án đúng đang trỏ vào ô trống.', 'bad'); return; }
      out.push({ type: 'mcq', q: q.q.trim(), options: o.map(function (x) { return x.t; }), answer: a });
    } else out.push({ type: 'essay', q: q.q.trim(), ref: q.ref.trim() });
  }
  var ex = { id: uid(), title: t, topic: NEW.topic.trim() || 'Toán 8', author: S.name, authorId: S.uid, at: Date.now(), questions: out };
  upsert('exams', ex).then(function (ok) { if (!ok) return; S.prof.c.created++; NEW = null; U.ev = 'list'; addXP(10); render(); });
}

/* ---------- sự kiện ---------- */
var ACT = {
  tab: function (t) { setTab(t.dataset.tab); },
  badges: function () { U.badges = !U.badges; render(); },
  enter: function () { var v = ($('#nm').value || '').trim(); if (!v) { toast('Hãy nhập tên hoặc biệt danh.', 'bad'); return; } S.name = v.slice(0, 24); U.nameEdit = false; saveProf(); render(); },
  rename: function () { U.nameEdit = true; render(); },
  wipe: function () {
    if (U.del === 'wipe') {
      U.del = null;
      if (DB) { var nm = S.name; S.prof = newProf(); S.name = nm; saveProf(); }
      else { try { localStorage.removeItem(KEY_L); } catch (e) {} var nm2 = S.name; S.prof = newProf(); S.questions = []; S.exams = []; S.attempts = []; S.subs = []; S.name = nm2; persistLocal(); }
      render();
    } else { U.del = 'wipe'; render(); setTimeout(function () { if (U.del === 'wipe') { U.del = null; render(); } }, 4000); }
  },
  'ask-send': sendQuestion,
  hint: function (t) { askHint(t.dataset.id); },
  'open-q': function (t) { U.openQ = t.dataset.id; U.tab = 'solve'; delete D.img.s; try { location.hash = 'giai'; } catch (e) {} render(); window.scrollTo(0, 0); },
  'close-q': function () { U.openQ = null; render(); },
  filter: function (t) { U.filter = t.dataset.f; render(); },
  'solve-send': function (t) { solveSend(t.dataset.id); },
  'rm-img': function (t) { delete D.img[t.dataset.slot]; var p = $('#prev-' + t.dataset.slot); if (p) p.innerHTML = ''; var f = $('#f-' + t.dataset.slot); if (f) f.value = ''; },
  take: function (t) { U.exId = t.dataset.id; U.ev = 'take'; D.img = {}; D.mc = {}; for (var k in D.txt) if (/^e\d+$/.test(k)) delete D.txt[k]; U.confirmBlank = false; render(); window.scrollTo(0, 0); },
  'exam-list': function () { U.ev = 'list'; U.busy = false; render(); },
  'exam-submit': examSubmit,
  gen: function () { U.ev = 'gen'; render(); },
  'gen-go': genExam,
  'new-exam': function () { NEW = newBlank(); U.ev = 'new'; render(); },
  'n-add': function (t) { NEW.qs.push(t.dataset.t === 'mcq' ? { type: 'mcq', q: '', opt: ['', '', '', ''], ans: 0 } : { type: 'essay', q: '', ref: '' }); render(); },
  'n-del': function (t) { NEW.qs.splice(Number(t.dataset.i), 1); render(); },
  'n-save': saveNew,
  'del-q': function (t) { confirmDel(t.dataset.id, function (id) { remove('questions', id); }); },
  'del-exam': function (t) { confirmDel(t.dataset.id, function (id) { remove('exams', id); }); }
};
function confirmDel(id, fn) {
  if (U.del === id) { U.del = null; fn(id); render(); }
  else { U.del = id; render(); setTimeout(function () { if (U.del === id) { U.del = null; render(); } }, 4000); }
}
function setTab(t) { U.tab = t; if (t !== 'solve') U.openQ = null; try { location.hash = { ask: 'hoi', solve: 'giai', exam: 'de' }[t]; } catch (e) {} render(); }
document.addEventListener('click', function (e) {
  var ins = e.target.closest('[data-ins]');
  if (ins) { var ta = document.getElementById(ins.dataset.target); if (ta) { ta.focus(); ta.setRangeText(ins.dataset.ins, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input', { bubbles: true })); } return; }
  var a = e.target.closest('[data-act]'); if (!a) return;
  var fn = ACT[a.dataset.act]; if (fn) fn(a, e);
});
function setPath(o, p, v) { var k = p.split('.'); for (var i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = v; }
function onField(e) {
  var t = e.target;
  if (t.dataset && t.dataset.draft) D.txt[t.dataset.draft] = t.value;
  if (t.dataset && t.dataset.f && NEW) setPath(NEW, t.dataset.f, t.type === 'radio' ? Number(t.value) : t.value);
  if (t.name && /^mc-\d+$/.test(t.name) && t.checked) D.mc[Number(t.name.slice(3))] = Number(t.value);
}
document.addEventListener('input', onField);
document.addEventListener('change', function (e) {
  onField(e);
  var t = e.target;
  if (t.type === 'file' && t.dataset.slot && t.files && t.files[0]) {
    var slot = t.dataset.slot;
    fileToImage(t.files[0]).then(function (r) { D.img[slot] = r; var p = $('#prev-' + slot); if (p) p.innerHTML = prevHTML(slot); }).catch(function (er) { toast(er && er.message === 'big' ? 'Ảnh quá nặng. Thử ảnh nhỏ hơn hoặc chụp gần hơn.' : 'Không đọc được ảnh này. Thử ảnh khác.', 'bad'); });
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'nm') { e.preventDefault(); ACT.enter(); } });
window.addEventListener('hashchange', function () { var m = { hoi: 'ask', giai: 'solve', de: 'exam' }[location.hash.slice(1)]; if (m && m !== U.tab) { U.tab = m; if (m !== 'solve') U.openQ = null; render(); } });
var h0 = { hoi: 'ask', giai: 'solve', de: 'exam' }[(location.hash || '').slice(1)]; if (h0) U.tab = h0;

/* ---------- khởi động ---------- */
function goLocal() { DB = null; U.net = 'local'; loadLocal(); U.ready = true; render(); }
function startDb() {
  U.net = 'loading';
  var timer = setTimeout(function () { if (U.net === 'loading') { U.net = 'slow'; paintNet(); } if (!U.ready) { U.ready = true; render(); } }, 10000);
  DB.doc('data/users/' + S.uid + '/profile').get().then(function (s) {
    if (s.exists) { var d = s.data() || {}; S.name = d.name || ''; var p = newProf(); S.prof = { xp: d.xp || 0, badges: d.badges || [], solved: d.solved || {}, c: Object.assign(p.c, d.c || {}) }; }
  }).catch(function () {}).then(function () { U.ready = true; render(); });
  function sub(q, col) {
    q.onSnapshot(function (snap) {
      S[col] = snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); });
      U.got[col] = true;
      if (['questions', 'exams', 'subs', 'players', 'attempts'].every(function (k) { return U.got[k]; })) { U.net = 'ok'; clearTimeout(timer); paintNet(); }
      if (U.ready) softRender();
    }, function (e) { if (U.net !== 'ok') { U.net = 'slow'; paintNet(); } if (e && e.code === 'revoked') toast('Quyền truy cập đã bị thu hồi. Hãy tải lại trang.', 'bad'); });
  }
  ['questions', 'exams', 'subs', 'players'].forEach(function (c) { sub(DB.collection(c), c); });
  sub(DB.collection('attempts').where('byId', '==', S.uid), 'attempts');
}
function boot() {
  render();
  if (!(window.claude && window.claude.use)) { goLocal(); return; }
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
    var db = r[0], us = r[1]; if (!db || !us) return null;
    return Promise.all([us.id(), us.canEdit(), us.isOwner()]).then(function (v) {
      if (!v[0]) return null;
      DB = db; S.uid = v[0]; U.isT = !!(v[1] || v[2]); return 1;
    });
  }).then(function (ok) { if (!ok) goLocal(); else startDb(); }).catch(function () { goLocal(); });
}
boot();
setTimeout(paintAI, 1500);
})();
</script>
</body>
